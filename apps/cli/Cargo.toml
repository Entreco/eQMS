[package]
name = "eqms-cli"
version.workspace = true
edition.workspace = true

[dependencies]
eqms-core = { path = "../../core/rust" }
clap = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[[bin]]
name = "qms"
path = "src/main.rs"
